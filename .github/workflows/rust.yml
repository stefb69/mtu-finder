name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Release creation is handled by release.yml (triggered by version tags).
# This workflow only verifies that the code builds and tests pass on every
# supported platform.
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      run: rustup default stable

    - name: Tests
      run: cargo test

    - name: Build
      run: cargo build --release --verbose
